<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        //         apply()
        // ✔ Definition:

        // apply() is similar to call(), but:

        // Arguments are passed as an array
        // ✔ Syntax:
        // functionName.apply(thisArg, [arg1, arg2])
        // ✔ Key Points:
        // Executes immediately

        
        // Arguments passed as array
        let person1 = {
            name: "Shreyank",
            greet: function (city, state) {
                console.log(`This is ${this.name} from ${city}, ${state}`);
            }
        };

        let person2 = { name: "Kiran" };

        person1.greet.apply(person2, ["Kalaburagi", "Karnataka"]);
    </script>
</body>

</html>
