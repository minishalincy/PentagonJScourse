<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>

        //call() is a built-in JavaScript method used to:

        // Invoke a function immediately
        // Set the value of this manually
        // ✔ Syntax:
        // functionName.call(thisArg, arg1, arg2, ...)
        // ✔ Key Points:
        // Executes immediately

        
        // Arguments passed normally (comma-separated)
        let person1 = {
            name: "Shreyank",
            greet: function (city, state) {
                console.log(`This is ${this.name} from ${city}, ${state}`);
            }
        };

        let person2 = { name: "Kiran" };

        person1.greet.call(person2, "Kalaburagi", "Karnataka");
    </script>
</body>

</html>
