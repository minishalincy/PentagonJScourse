<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function outer() {
            let count = 0;
            function inner() {
                count++
                console.log(count);

            }

            return inner //That inner function remembers count, even after outer() is finished 
            // This “remembering” is called a closure

        }

        let a = outer()
        a()
        a()
        a()

    </script>
</body>

</html>
