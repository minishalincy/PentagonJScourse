<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Hello there!</h1>
    <h1>Welcome</h1>
    <button onclick="colorChangec()">Change color</button>

    <script>
        function colorChangec(){
            let cc = document.getElementsByTagName("h1")
            cc[1].style.color = "pink"
        }
    </script>
</body>
</html>
