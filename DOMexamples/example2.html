<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="html">HTML</h1>
    <button onclick="change()">change!</button>

    <script>
        function change(){
            let changeEle = document.getElementById("html")
            changeEle.innerText = "Javascript"
            changeEle.style.color = "red"
        }
    </script>
</body>
</html>
