<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
</head>
<body>
    <div id="parent" style="background-color: powderblue; padding: 30px;"></div>
    <button id="child" style="background-color: rebeccapurple; padding: 6px; cursor: pointer; margin-top: 6px;">Click</button>

    <script>
      
            let parent = document.getElementById("parent")
            let child = document.getElementById("child")

            parent.addEventListener("click",()=>{
                alert("Parent clicked")
            })

            child.addEventListener("click",(e)=>{
                // e.stopPropagation

                alert("child clicked")
            })
                
            
        
    </script>
</body>
</html>
