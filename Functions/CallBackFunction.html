<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //create a funtion
        function displayMsg(message){
            console.log(message);
            
        }

        //callback
        function process(callback){
            let msg = "this is a callback func"

            return callback(msg)
        }

        //function call

        process(displayMsg)
    </script>
</body>
</html>
