<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        //create a named function
        function greet(name) {
            return "Hello " + name
        }

        //create a HOF
        function userInput(callback) {
            let name = "Lincy"
            return callback(name) //meaning greet("Lincy")
        }

        //function call
        let res = userInput(greet)

        console.log(res);

    </script>
</body>

</html>
