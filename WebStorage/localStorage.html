<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //to store the data we use setItem
        localStorage.setItem("username","Minisha")
        localStorage.setItem("age",21)

        //to fetch the data we use getItem //gotta store the fetched data in a variable
        let a = localStorage.getItem("username")
        let b = localStorage.getItem("age")
        console.log(a);
        console.log(b);
        
    </script>
</body>
</html>
