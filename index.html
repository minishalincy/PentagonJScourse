<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./PromptMethod.js">

    <style>
        button {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Hello there!</h1>
    <button onclick="console.log('clicked')">Click me!</button>
    <script>
        let num1 = Number(prompt('enter number 1')); //default prompt() will return string value so we choose the explicit casting
        let num2 = Number(prompt('enter number 2'));

        console.log(typeof (num1), typeof (num2));
        console.log(`sum of ${num1} and ${num2} is ${num1 + num2}`);
    </script>
</body>

</html>
